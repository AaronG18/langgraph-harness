[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-harness"
version = "0.6.0"
description = "Per-node HARNESS parsing, injection and enforcement for LangGraph nodes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AaronG18" }]
keywords = ["langgraph", "llm", "agents", "guardrails", "prompt", "harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["langgraph>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
langgraph-harness = "langgraph_harness.cli:main"

[project.urls]
Homepage = "https://github.com/AaronG18/langgraph-harness"
Repository = "https://github.com/AaronG18/langgraph-harness"
Issues = "https://github.com/AaronG18/langgraph-harness/issues"

[tool.setuptools.packages.find]
include = ["langgraph_harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
